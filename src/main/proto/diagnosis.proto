syntax = "proto3";
package diagnosis;

option java_package = "com.csust.eyediagnosis.grpc";
option java_outer_classname = "DiagnosisProto";

message DiagnosisRequest {
  bytes image_data = 1;
  string image_format = 2;
}

message DiseasePrediction {
  string label = 1;
  double probability = 2;
}

enum OodStatus {
  OOD_STATUS_UNSPECIFIED = 0;
  NOT_EVALUATED = 1;
  IN_DISTRIBUTION = 2;
  OUT_OF_DISTRIBUTION = 3;
  EVALUATION_FAILED = 4;
}

// 图像质量门的状态：与分类结论、OOD 分开，各自可追责。
enum ImageQualityState {
  QUALITY_UNSPECIFIED = 0;
  QUALITY_PASSED = 1;
  QUALITY_FAILED = 2;
  QUALITY_NOT_EVALUATED = 3;
}

message DiagnosisResponse {
  string predicted_label = 1;
  double probability = 2;
  // 旧字段：语义是「原始 softmax 百分数」，不是校准概率，也不是医学可靠性。
  // 仅作兼容保留，新代码请用 classification_probability + calibration_state。
  int32 reliability_score = 3 [deprecated = true];
  string description = 4;
  repeated DiseasePrediction top_predictions = 5;
  bool rejected = 6;
  string abstain_reason = 7;
  int32 quality_score = 8;
  bool is_ood = 9;
  string model_version = 10;
  string weight_sha256 = 11;
  bool requires_review = 12;
  string quality_reasons = 13;
  double calibrated_probability = 14;
  double ood_score = 15;
  string preprocess_version = 16;
  OodStatus ood_status = 17;
  string calibration_status = 18;
  string inference_policy_version = 19;

  // ── 2026-11-23：把混在一起的语义拆成互不冒充的独立字段 ──────────────
  // 分类概率：0–1 的原始 softmax 分布的 top-1。它**不是**校准概率，
  // 更不是「诊断可靠性」；没有校准时只能当作模型输出强度来读。
  double classification_probability = 20;
  // 校准产物版本（含数据集、样本量与统计口径）：可追到「这份概率是怎么来的」。
  string calibration_version = 21;
  ImageQualityState image_quality_state = 22;
  // 质量门判据版本：阈值变了必须换版本，否则历史记录无法区分。
  string image_quality_version = 23;
  // 质量门「阈值本身」是否在真实数据上标定过（UNCALIBRATED / CALIBRATED）。
  // 与 image_quality_state 分开：前者说「这张图过没过」，后者说「判据可不可信」。
  string image_quality_calibration_state = 24;
  // 是否允许作为面向患者的结论呈现：由算法侧按质量门与拒识判定，
  // 与「准入是否放行任务」是两道独立的门，不要互相替代。
  bool patient_conclusion_allowed = 25;
  // 校准状态沿用 calibration_status（CALIBRATED / NOT_CALIBRATED）：
  // 它已经是独立字段，与分类概率分开；OOD 的状态在 ood_status。
  // 版本绑定的 OOD 验证产物落地时，再补一个 ood_evaluation_version 字段——
  // 在那之前没有版本可写，写空串等于编造出处。
}

service DiagnosisService {
  rpc Diagnose(DiagnosisRequest) returns (DiagnosisResponse);
}
