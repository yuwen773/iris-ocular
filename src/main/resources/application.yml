server:
  # 端口
  port: 8081
  servlet:
    context-path: /api
    # cookie 30 天过期；SameSite=Lax 是 CSRF 基线防护。
    # Secure 默认关闭（本地 http 调试需要），生产由 SESSION_COOKIE_SECURE=true 打开，
    # 且 StartupSafetyGuard 会在 server/prod profile 下强制要求它。
    session:
      cookie:
        max-age: 2592000
        same-site: lax
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  servlet:
    multipart:
      # 上传文件最大大小 10MB
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    # 时间统一走 ApiDateSerializer（带偏移的 ISO-8601），不输出数字时间戳。
    serialization:
      write-dates-as-timestamps: false
  profiles:
    # 启用配置文件
    active: local,dev
  application:
    name: eye-diagnosis
  # ── PostgreSQL 18 + pgvector ───────────────────────────────────────────────
  # 业务关系数据在 diagnosis schema，RAG 向量在 rag schema，同一实例、独立 schema
  # 逻辑隔离。currentSchema 同时决定 MyBatis 生成 SQL 的解析路径与 date_format()
  # 等兼容函数的可见性。
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/iris?currentSchema=diagnosis,rag,public&stringtype=unspecified}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:iris_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    # 历史 MySQL 迁移链（db/migration）保持原样、不再改写；PostgreSQL 线是独立
    # 的历史。默认只跑 PostgreSQL 线；要跑旧 MySQL 线必须显式覆盖 locations。
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/postgresql}
    schemas: diagnosis
    default-schema: diagnosis
    create-schemas: true
    baseline-on-migrate: false
    validate-on-migrate: true
    # 迁移账号与应用账号分离：应用账号没有 DDL 权限，迁移由 iris_migrator 执行。
    # 未显式配置时回落到数据源账号（本地单账号开发场景），生产必须分开。
    user: ${IRIS_FLYWAY_USER:${spring.datasource.username}}
    password: ${IRIS_FLYWAY_PASSWORD:${spring.datasource.password}}
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # SQL 日志默认关闭：StdOut 会把每条语句与参数打到标准输出，患者影像路径、
    # 会话内容、用户输入都会进日志文件。本地要看得见 SQL 就设
    # MYBATIS_LOG_IMPL=org.apache.ibatis.logging.stdout.StdOutImpl。
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      logic-delete-field: isDelete # 逻辑删除字段
      logic-delete-value: 1 # 逻辑已删除
      logic-not-delete-value: 0 # 逻辑未删除字段
# 接口文档配置
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.csust.eyediagnosis.controller
# knife4j
# 接口文档默认关闭：它把全部接口与数据模型摊开在 /doc.html，生产不需要也不该有。
# 本地要浏览文档就设 KNIFE4J_ENABLE=true。
knife4j:
  enable: ${KNIFE4J_ENABLE:false}
  setting:
    language: zh_cn
logging:
  level:
    # 模型调用调试日志默认 warn：debug 会把完整 prompt / 消息体打进日志。
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: ${ADVISOR_LOG_LEVEL:warn}
    com.csust.eyediagnosis.service.impl.DocumentProcessingService: info

# MCP 远程白名单：精确 Origin 列表（如 https://mcp.example.com），默认空（拒绝所有远程）
mcp:
  remote:
    allowed-origins: ${MCP_ALLOWED_ORIGINS:}
  executor:
    core-size: ${MCP_EXECUTOR_CORE:4}
    max-size: ${MCP_EXECUTOR_MAX:16}
    queue-capacity: ${MCP_EXECUTOR_QUEUE:64}
    timeout-seconds: ${MCP_EXECUTOR_TIMEOUT:60}
    per-server-max: ${MCP_PER_SERVER_MAX:8}
  tool-timeout-seconds: ${MCP_TOOL_TIMEOUT:30}

# CORS 精确白名单：仅允许配置的 Origin；未配置环境变量时拒绝所有跨域凭据请求
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# 微信小程序：AppID/AppSecret 只从环境变量注入，仓库里不出现真实值。
# 未配置时 /api/mp/auth/login 直接返回 50000，不会带着空 AppID 去请求微信。
wechat:
  miniapp:
    appid: ${WECHAT_MINIAPP_APPID:}
    secret: ${WECHAT_MINIAPP_SECRET:}
    # 登录令牌有效期（天），每次校验滑动续期。
    token-ttl-days: ${WECHAT_MINIAPP_TOKEN_TTL_DAYS:30}

# 眼科图像分析配置
# 事务性 Outbox 已退役：t_agent_message_outbox 与 t_agent_message 同库，
# 没有跨系统边界可跨，且原有 dispatcher 会重放历史行。会话消息统一由
# ChatMessageWriter 单事务直写 t_agent_message；表中历史行保留不清理。
agent:
  # 上游模型 reasoning 默认不展示、不落库；显式开启才进入消息流与历史。
  expose-reasoning: false
  tool-audit:
    # 结构化工具调用审计：SSE 状态事件始终可用，但默认完全不落库。
    # 启用前必须部署 V28 表，并通过部署环境变量提供独立 HMAC 密钥。
    enabled: false
    digest-key: ${AGENT_TOOL_AUDIT_DIGEST_KEY:iris-tool-audit-dev-only-key}
eye-diagnosis:
  # 数据分析（/api/stats/admin/analytics）使用 CTE + 窗口函数；RAG 使用 pgvector，
  # 历史 MySQL 线已退役。启动基线要求连接的是 PostgreSQL 18+ 且 vector 扩展已安装，
  # 不满足时启动即失败，避免接口到运行时才返回 50000。
  database:
    require-postgresql: true
    min-major-version: 18
  # 配置中心（Iris Control Center 1.0，WP-01 起逐步实现）。
  # 默认关闭：关闭时不注册 CSRF 端点、不做严格 Origin 与 CSRF 校验，
  # 全站行为与引入配置中心之前一致。开启前请先读
  # docs/product/wp-00/configuration-boundary.md 与 config-center-adr.md。
  control-center:
    enabled: false
    # 写端点的严格 Origin 白名单，必须是完整 origin（scheme://host[:port]）。
    # 反代未改写 Host / scheme 时，把外部访问的 origin 显式登记在这里。
    # 不支持通配符或子域后缀匹配。
    allowed-origins: []
    # 仅当反向代理会覆写 X-Forwarded-Proto 时才可开启；否则客户端可伪造。
    trust-proxy-headers: false
    # 允许发布 / 回滚配置的管理员 userId。为空表示没有人可以发布——
    # 开启控制中心不会顺带给出发布能力。
    publisher-user-ids: []
  collaboration:
    enabled: false
    admission-enabled: false
    graph-enabled: false
    patient-progress-enabled: false
    clinician-detail-enabled: false
  feedback:
    # 用户反馈（/api/feedback、/api/admin/feedback）：产品意见通道，不是医疗记录。
    # 默认开启；关闭时端点回 40300 +「反馈功能暂未启用」，不返回 404。
    # 注意：前端入口（/feedback、/admin/feedback）不读这个开关，关闭后入口仍在，
    # 页面会按 40300 显示权限类提示。要彻底下线需同时移除入口/路由。
    enabled: true
    # 每用户每分钟最多提交条数；Redis 不可用时放行（限流是防刷手段，不是业务前提）。
    rate-limit-per-minute: 5
  notification:
    # 已读通知保留天数（物理删除）；未读通知永不清理。<=0 表示关闭清理。
    # 没有开关：通知是主流程的旁路，写失败只记日志，不需要单独关停。
    retention-days: 90
  agent:
    # Chat history uses the ordinary single-write persistence path. Do not
    # enable the legacy dispatcher or it can replay pre-existing Outbox rows.
    outbox:
      enabled: false
    # 短期图片引用：Java 侧签发、算法侧 MCP 校验，两侧密钥必须一致。
    # 两个变量名都认（MCP_IMAGE_REF_SECRET 优先，其次 IMAGE_REFERENCE_SECRET），
    # 算法侧同样两个都认——名字写错不会变成「验不过」这种难查的故障。
    # 未配置时签发直接失败，不生成验不过的引用。
    image-reference:
      secret: ${MCP_IMAGE_REF_SECRET:${IMAGE_REFERENCE_SECRET:}}
      ttl-seconds: 300
  # 上传补偿对账：清理 COS 上没有任务行登记的孤儿图片。
  # 默认开启：该任务是「对象已写入、任务行没写成」这类残留的唯一周期性兜底，
  # 关闭会让孤儿对象无限累积。清理前有 30 分钟宽限期，且只删没有有效任务行的对象。
  upload:
    compensation:
      enabled: true
      interval-ms: 3600000
      initial-delay-ms: 600000
      # 宽限期：最近 N 分钟内被修改的对象不参与清理，避免误删正在上传的图片
      min-age-minutes: 30
    # public/ 前缀（判读原图、用户头像）没有任务表登记，只做只读审计：
    # 列出「没有任何数据库记录引用」的对象并告警，删除仍由人决定。
    orphan-audit:
      enabled: true
      interval-ms: 86400000
      initial-delay-ms: 1800000
      min-age-minutes: 1440
  inference:
    model-version: efficientnet-b4@1.0.0
    model-weight-sha256: ${MODEL_WEIGHTS_SHA256:}
    preprocess-version: v1
    policy-version: ${INFERENCE_POLICY_VERSION:medical-safety-v3-quality-observe}
  vision-recognition:
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    # 刻意不写默认值：密钥没配就在启动阶段失败，而不是等到第一个真实请求才报 401。
    # 真实值由环境变量 DASHSCOPE_API_KEY 注入（见 README「配置后端本地环境」）。
    api-key: ${DASHSCOPE_API_KEY}
    model: qwen3-vl-plus
  rag:
    chunk-size: 800
    chunk-overlap: 100
    # pgvector 存储位置。表与 HNSW 索引由 Flyway（db/postgresql）建立，
    # 应用启动不建表、不删表。维度与 DashScope text-embedding-v3 默认输出一致。
    vector-store:
      schema: rag
      table: iris_knowledge_vectors
      dimensions: 1024
    # 内置眼科知识语料（classpath:rag/*.md）播种：开启后启动时切分并写入 pgvector。
    # 播种需要调用嵌入模型（产生费用），默认关闭。
    corpus:
      seed-enabled: false
      resource-pattern: classpath*:rag/*.md
    search:
      top-k: 20
      final-top-k: 5
      similarity-threshold: 0.5
    rerank:
      enabled: true
      model: gte-rerank-v2
    hybrid-search:
      # 词法通道已重建为「按 owner 元数据直取该用户可见的全部分块」，不再是
      # 「语义近邻前 1000 条」那种语义偏置的子集；词法命中仍需回向量库核对
      # similarity-threshold，核对不通过的会被丢弃并记账，因此不会绕过阈值成为证据。
      # 默认开启：旧实现默认开着但通道是错的，关掉只是把「召回不全」换成「词法召回没了」。
      # WP-Q1 的 Recall@K / 延迟评估仍待补，届时按评估结果调 max-corpus-chunks。
      enabled: true
      rrf-k: 60
      # 一次词法召回最多取多少分块（内存边界，不是召回目标）。触顶会记 WARN。
      # 默认值要高于「上万分块」这一档，否则万级知识库一进来就被截断。
      max-corpus-chunks: 20000
      # 所有用户缓存语料的分块总量上限；超出按 LRU 驱逐最久未用的用户语料。
      max-total-corpus-chunks: 40000
      # 词法语料缓存的用户数上限；超出按 LRU 驱逐。
      cache-max-users: 20
    # B2 来源标记：默认关闭。开启后只会在既有 owner 过滤之后进一步收窄
    # 可见集合（BUILTIN/USER_UPLOAD 保留，UNKNOWN/AUTHORIZED_EXTERNAL 一律排除），
    # 绝不扩大默认可见性；不参与受控引用库的准入判定。
    source-type:
      enabled: false
  # Iris News Engine WP-02 内部 Worker 控制面（默认 fail-closed 关闭；凭据只由部署环境变量注入）
  news-ingestion:
    enabled: false
    workers: {}
    # 直连对端白名单（精确 IP）：只认「直接连到本服务」的对端。带转发头的请求一律拒绝，
    # 因为 native 转发处理会用 X-Forwarded-For 改写 getRemoteAddr()，直连对端不可判定。
    allowed-remote-addresses: []
    # 显式声明可信反向代理（精确 IP 或 CIDR）。启用 server.forward-headers-strategy=native
    # 时必须声明：启动基线会与 server.tomcat.remoteip.internal-proxies 交叉核对——声明的每个
    # 地址都必须落在正则内，正则也不得命中声明范围之外的探针地址（例如信任整个 10/8 会被拒绝）。
    # 这是对常见过宽写法的拦截，不是对任意正则覆盖范围的穷尽证明。
    trusted-proxy-addresses: []
    require-https: false
    plaintext-allowed: false
    lease-duration: 5m
    retry-base-delay: 30s
    retry-max-delay: 15m
    default-max-attempts: 3
  # WP-08A 自动规划受两层全局开关与每个信源的开关控制。
  news-schedule:
    enabled: false
    poll-interval: PT1M
    sources: []
  # Iris News Engine WP-03 资讯精选、证据规则与付费模型预算门（默认 fail-closed 关闭）
  news-curation:
    enabled: false
    policy-version: news-curation-v1
    provider: dashscope
    model-name: qwen3.5-plus
    call-timeout: 20s
    daily-max-calls: 100
    daily-max-tokens: 500000
    daily-max-cost-micros: 5000000
    # 整次实验总上限：与日上限不同，计数跨 UTC 日期、跨 budget scope、跨进程重启。
    # 0 表示该维度不设上限；上限只能收紧，更大的配置值不会抬高已记录的值。
    lifetime-max-calls: 0
    lifetime-max-tokens: 0
    lifetime-max-cost-micros: 0
    estimated-tokens-per-call: 4000
    estimated-cost-micros-per-call: 50000
    max-response-chars: 16000
