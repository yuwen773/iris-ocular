server:
  # 端口
  port: 8081
  servlet:
    context-path: /api
    # cookie 30 天过期；SameSite=Lax 是 CSRF 基线防护。
    # Secure 默认关闭（本地 http 调试需要），生产由 SESSION_COOKIE_SECURE=true 打开，
    # 且 StartupSafetyGuard 会在 server/prod profile 下强制要求它。
    session:
      cookie:
        max-age: 2592000
        same-site: lax
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  servlet:
    multipart:
      # 上传文件最大大小 10MB
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    # 时间统一走 ApiDateSerializer（带偏移的 ISO-8601），不输出数字时间戳。
    serialization:
      write-dates-as-timestamps: false
  profiles:
    # 启用配置文件
    active: local,dev
  application:
    name: eye-diagnosis
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration,classpath:db/callback
    schemas: diagnosis
    validate-on-migrate: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # SQL 日志默认关闭：StdOut 会把每条语句与参数打到标准输出，患者影像路径、
    # 会话内容、用户输入都会进日志文件。本地要看得见 SQL 就设
    # MYBATIS_LOG_IMPL=org.apache.ibatis.logging.stdout.StdOutImpl。
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      logic-delete-field: isDelete # 逻辑删除字段
      logic-delete-value: 1 # 逻辑已删除
      logic-not-delete-value: 0 # 逻辑未删除字段
# 接口文档配置
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.csust.eyediagnosis.controller
# knife4j
# 接口文档默认关闭：它把全部接口与数据模型摊开在 /doc.html，生产不需要也不该有。
# 本地要浏览文档就设 KNIFE4J_ENABLE=true。
knife4j:
  enable: ${KNIFE4J_ENABLE:false}
  setting:
    language: zh_cn
logging:
  level:
    # 模型调用调试日志默认 warn：debug 会把完整 prompt / 消息体打进日志。
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: ${ADVISOR_LOG_LEVEL:warn}
    com.csust.eyediagnosis.service.impl.DocumentProcessingService: info

# MCP 远程白名单：精确 Origin 列表（如 https://mcp.example.com），默认空（拒绝所有远程）
mcp:
  remote:
    allowed-origins: ${MCP_ALLOWED_ORIGINS:}
  executor:
    core-size: ${MCP_EXECUTOR_CORE:4}
    max-size: ${MCP_EXECUTOR_MAX:16}
    queue-capacity: ${MCP_EXECUTOR_QUEUE:64}
    timeout-seconds: ${MCP_EXECUTOR_TIMEOUT:60}
    per-server-max: ${MCP_PER_SERVER_MAX:8}
  tool-timeout-seconds: ${MCP_TOOL_TIMEOUT:30}

# CORS 精确白名单：仅允许配置的 Origin；未配置环境变量时拒绝所有跨域凭据请求
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# 眼科图像分析配置
# 事务性 Outbox 已退役：t_agent_message_outbox 与 t_agent_message 同库，
# 没有跨系统边界可跨，且原有 dispatcher 会重放历史行。会话消息统一由
# ChatMessageWriter 单事务直写 t_agent_message；表中历史行保留不清理。
agent:
  # 上游模型 reasoning 默认不展示、不落库；显式开启才进入消息流与历史。
  expose-reasoning: false
  tool-audit:
    # 结构化工具调用审计：SSE 状态事件始终可用，但默认完全不落库。
    # 启用前必须部署 V28 表，并通过部署环境变量提供独立 HMAC 密钥。
    enabled: false
    digest-key: ${AGENT_TOOL_AUDIT_DIGEST_KEY:iris-tool-audit-dev-only-key}
eye-diagnosis:
  # 数据分析（/api/stats/admin/analytics）使用 CTE + 窗口函数，最低 MySQL 8.0。
  # 低于 8.0 时启动即失败，避免接口到运行时才返回 50000。
  # 本机 3306 通常是 5.7、3307 是 8.0：dev 数据源必须指向 8.0 实例。
  database:
    require-mysql8: true
  collaboration:
    enabled: false
    admission-enabled: false
    graph-enabled: false
    patient-progress-enabled: false
    clinician-detail-enabled: false
  agent:
    # Chat history uses the ordinary single-write persistence path. Do not
    # enable the legacy dispatcher or it can replay pre-existing Outbox rows.
    outbox:
      enabled: false
    # 短期图片引用：Java 侧签发、算法侧 MCP 校验，两侧密钥必须一致
    # （算法侧读 MCP_IMAGE_REF_SECRET）。未配置时签发直接失败，不生成验不过的引用。
    image-reference:
      secret: ${IMAGE_REFERENCE_SECRET:}
      ttl-seconds: 300
  # 上传补偿对账：清理 COS 上没有任务行登记的孤儿图片。
  # 默认开启：该任务是「对象已写入、任务行没写成」这类残留的唯一周期性兜底，
  # 关闭会让孤儿对象无限累积。清理前有 30 分钟宽限期，且只删没有有效任务行的对象。
  upload:
    compensation:
      enabled: true
      interval-ms: 3600000
      initial-delay-ms: 600000
      # 宽限期：最近 N 分钟内被修改的对象不参与清理，避免误删正在上传的图片
      min-age-minutes: 30
  inference:
    model-version: efficientnet-b4@1.0.0
    model-weight-sha256: ${MODEL_WEIGHTS_SHA256:}
    preprocess-version: v1
    policy-version: ${INFERENCE_POLICY_VERSION:medical-safety-v3-quality-observe}
  vision-recognition:
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    api-key: your-api-key-here
    model: qwen-vl-plus
  rag:
    chunk-size: 800
    chunk-overlap: 100
    # 内置眼科知识语料（classpath:rag/*.md）播种：开启后启动时切分并写入 ChromaDB。
    # 播种需要调用嵌入模型（产生费用），默认关闭。
    corpus:
      seed-enabled: false
      resource-pattern: classpath*:rag/*.md
    search:
      top-k: 20
      final-top-k: 5
      similarity-threshold: 0.5
    rerank:
      enabled: true
      model: gte-rerank-v2
    hybrid-search:
      # 默认关闭：词法通道需要按 owner 元数据直取全量分块，语料规模越大取回成本越高。
      # 词法通道已重建为「按 owner 直取该用户可见的全部分块」，不再是「语义近邻前 1000 条」
      # 那种语义偏置的子集；词法命中仍需回向量库核对 similarity-threshold，核对不通过的
      # 会被丢弃并记账。开启前请按 WP-Q1 补 Recall@K / 延迟评估。
      enabled: false
      rrf-k: 60
      # 一次词法召回最多取多少分块（内存边界，不是召回目标）。触顶会记 WARN。
      max-corpus-chunks: 5000
      # 词法语料缓存的用户数上限；超出按 LRU 驱逐。
      cache-max-users: 20
    # B2 来源标记：默认关闭。开启后只会在既有 owner 过滤之后进一步收窄
    # 可见集合（BUILTIN/USER_UPLOAD 保留，UNKNOWN/AUTHORIZED_EXTERNAL 一律排除），
    # 绝不扩大默认可见性；不参与受控引用库的准入判定。
    source-type:
      enabled: false
