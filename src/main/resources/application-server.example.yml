# 服务器部署配置示例（请复制为 application-server.yml 并填写真实凭据）
# 真实文件 application-server.yml 已加入 .gitignore，请勿提交到仓库
spring:
  # PostgreSQL 18 + pgvector。业务关系数据在 diagnosis schema，RAG 向量在 rag
  # schema，同一实例逻辑隔离；currentSchema 决定解析路径。
  datasource:
    url: jdbc:postgresql://<host>:5432/iris?currentSchema=diagnosis,rag,public&stringtype=unspecified
    driver-class-name: org.postgresql.Driver
    # 应用账号只有 USAGE + DML，没有 DDL、装扩展与迁移历史读写权限。
    username: iris_app
    password: ${IRIS_DB_APP_PASSWORD}
  flyway:
    locations: classpath:db/postgresql
    schemas: diagnosis
    default-schema: diagnosis
    create-schemas: true
    validate-on-migrate: true
    # 迁移账号拥有 DDL；由 scripts/postgresql/bootstrap-roles.sql 一次性建立。
    user: iris_migrator
    password: ${IRIS_DB_MIGRATOR_PASSWORD}
  jackson:
    # 不要设置 date-format：无 time-zone 的 SimpleDateFormat 会按 UTC 输出
    # 无偏移墙钟，正是 R3 修掉的 8 小时时差。时间格式统一由 JsonConfig 的
    # ApiDateSerializer 产出带偏移的 ISO-8601。
    serialization:
      write-dates-as-timestamps: false
  session:
    store-type: redis
    timeout: 2592000
  data:
    redis:
      host: <redis-host>
      port: 6379
      database: 8
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          max-wait: -1
      connect-timeout: 3000
  ai:
    # 向量库是 PostgreSQL 的 rag schema（表 rag.iris_knowledge_vectors），
    # 不再有独立的 Chroma 服务。表与索引由 Flyway 迁移建立，应用启动不建表、不删表。

    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen3.5-plus
          temperature: 0.3
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        enabled: true
        options:
          model: text-embedding-v3
      # rerank 必须缩进在 dashscope 之下，绑到 spring.ai.dashscope.rerank.*；
      # 与 dashscope 同级会绑成 spring.ai.rerank.*，重排配置会静默失效。
      rerank:
        options:
          model: gte-rerank-v2
        top-n: 5
        return-documents: true

cos:
  client:
    host: <cos-host>
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: <cos-region>
    bucket: <cos-bucket>

diagnosis:
  grpc:
    host: 127.0.0.1
    port: 50051
    deadline-ms: 10000

eye-diagnosis:
  vision-recognition:
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    api-key: ${DASHSCOPE_API_KEY}
    model: qwen3-vl-plus
  # ── Iris News Engine：内部 Worker 通道（默认关闭） ────────────────────────
  # 采集 Worker 走 /api/internal/news/v1/leases/**，与用户会话、微信小程序令牌完全隔离。
  # 凭据只由部署环境变量注入，仓库里不出现真实值；Worker 密钥需 32–256 位可见 ASCII。
  # 采集与自动发布默认关闭：合并进主干不等于在生产启用。
  news-ingestion:
    enabled: false
    workers: {}
    #   <worker-id>:
    #     key: ${IRIS_NEWS_WORKER_KEY}
    #     allowed-sources: [pubmed]
    # 直连对端白名单（精确 IP）：只认「直接连到本服务」的对端。
    # 带转发头的请求一律 403——转发头出现即说明对端不是 Worker 本身，
    # 且原始对端在应用侧不可判定。
    allowed-remote-addresses: []
    # 显式声明可信反向代理（精确 IP 或 CIDR）；启动基线会与上面的 internal-proxies 交叉核对：
    # 声明的每个地址都必须落在正则内，正则也不得命中声明范围之外的探针地址。
    # 拦截的是常见过宽写法，不是对任意正则覆盖范围的穷尽证明。
    trusted-proxy-addresses: []
    require-https: false
    plaintext-allowed: false
    lease-duration: 5m
    retry-base-delay: 30s
    retry-max-delay: 15m
    default-max-attempts: 3
  rag:
    chunk-size: 800
    chunk-overlap: 100
    search:
      top-k: 20
      final-top-k: 5
      similarity-threshold: 0.5
    rerank:
      enabled: true
      model: gte-rerank-v2
    hybrid-search:
      # 词法通道按 owner 元数据直取该用户可见的全部分块做 BM25，命中后回向量库核对阈值；
      # 默认开启（与 application.yml 一致）。语料规模大时按 max-corpus-chunks 调内存边界。
      enabled: true
      rrf-k: 60
      max-corpus-chunks: 20000
      max-total-corpus-chunks: 40000
      cache-max-users: 20

# ── 生产安全基线 ────────────────────────────────────────────────────────────
# 下面四项在 application.yml 里已经是安全默认值；这里显式写出来，是因为它们一旦被
# 改回开发值（旧配置文件、临时调试忘了改），患者数据就会进日志或接口文档页。
# StartupSafetyGuard 在 server/prod profile 下会逐项检查，任一项不满足即拒绝启动。
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
knife4j:
  enable: false

logging:
  level:
    # 模型 prompt 与消息体只在排查时临时开 debug，排查完改回来。
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: warn
    com.csust.eyediagnosis.service.impl.DocumentProcessingService: info

server:
  servlet:
    session:
      cookie:
        # 站点走 HTTPS 时必须为 true；由 StartupSafetyGuard 强制。
        secure: true
  # ── 反向代理信任边界（News Worker 通道） ─────────────────────────────────
  # Worker 的 HTTPS 门禁读 request.isSecure()，该值只由「来源可信」的转发头置真。
  # 因此：
  #   1) strategy 只能是 none 或 native。framework 的 ForwardedHeaderFilter 不校验来源，
  #      外部直连带一个 X-Forwarded-Proto: https 就能伪造，部署基线会直接拒绝启动。
  #   2) native 必须同时给出下面两处，且两者会被启动基线逐条核对：
  #      - tomcat.remoteip.internal-proxies：精确到反代 IP 的正则，不要抄默认网段
  #        （信任整个 10/8 会让同网段任意主机伪造 HTTPS 状态）；
  #      - eye-diagnosis.news-ingestion.trusted-proxy-addresses：运维视角的可信代理清单。
  #   3) 反代必须「覆盖」客户端自带的 X-Forwarded-For，而不是追加——否则持可信代理的
  #      对端仍能伪造生效的客户端地址。
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '10\.0\.0\.5'

# ── gRPC 诊断通道 ───────────────────────────────────────────────────────────
# 影像字节与诊断结论都走这条链路。非回环地址上的明文连接既无加密也无对端校验，
# 因此跨主机部署必须二选一，否则 StartupSafetyGuard 在 server/prod 下拒绝启动：
#   1) 开 TLS（下面的 tls-enabled: true；内网私有 CA 用 tls-ca-cert-path，需双向认证再加客户端证书）；
#   2) 或确认这段链路已被网络隔离覆盖，显式承认 plaintext-allowed: true。
diagnosis:
  grpc:
    host: 127.0.0.1            # 算法服务地址；跨主机时改成内网地址
    port: 50051
    tls-enabled: false
    # tls-ca-cert-path: /etc/iris/certs/ca.pem
    # tls-client-cert-path: /etc/iris/certs/client.pem
    # tls-client-key-path: /etc/iris/certs/client-key.pem
    plaintext-allowed: false
