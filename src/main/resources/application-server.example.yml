# 服务器部署配置示例（请复制为 application-server.yml 并填写真实凭据）
# 真实文件 application-server.yml 已加入 .gitignore，请勿提交到仓库
spring:
  datasource:
    url: jdbc:mysql://<host>:3306/diagnosis?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: <db-user>
    password: <db-password>
  jackson:
    # 不要设置 date-format：无 time-zone 的 SimpleDateFormat 会按 UTC 输出
    # 无偏移墙钟，正是 R3 修掉的 8 小时时差。时间格式统一由 JsonConfig 的
    # ApiDateSerializer 产出带偏移的 ISO-8601。
    serialization:
      write-dates-as-timestamps: false
  session:
    store-type: redis
    timeout: 2592000
  data:
    redis:
      host: <redis-host>
      port: 6379
      database: 8
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          max-wait: -1
      connect-timeout: 3000
  ai:
    vectorstore:
      chroma:
        client:
          host: <chroma-host>
          port: 8000
        collection-name: diagnosis-knowledge
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen3.5-plus
          temperature: 0.3
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        enabled: true
        options:
          model: text-embedding-v3
      # rerank 必须缩进在 dashscope 之下，绑到 spring.ai.dashscope.rerank.*；
      # 与 dashscope 同级会绑成 spring.ai.rerank.*，重排配置会静默失效。
      rerank:
        options:
          model: gte-rerank-v2
        top-n: 5
        return-documents: true

cos:
  client:
    host: <cos-host>
    secretId: ${COS_SECRET_ID}
    secretKey: ${COS_SECRET_KEY}
    region: <cos-region>
    bucket: <cos-bucket>

diagnosis:
  grpc:
    host: 127.0.0.1
    port: 50051
    deadline-ms: 10000

eye-diagnosis:
  vision-recognition:
    base-url: https://dashscope.aliyuncs.com/compatible-mode
    api-key: ${DASHSCOPE_API_KEY}
    model: qwen3-vl-plus
  rag:
    chunk-size: 800
    chunk-overlap: 100
    search:
      top-k: 20
      final-top-k: 5
      similarity-threshold: 0.5
    rerank:
      enabled: true
      model: gte-rerank-v2
    hybrid-search:
      # 词法通道按 owner 元数据直取该用户可见的全部分块做 BM25，命中后回向量库核对阈值；
      # 默认开启（与 application.yml 一致）。语料规模大时按 max-corpus-chunks 调内存边界。
      enabled: true
      rrf-k: 60
      max-corpus-chunks: 20000
      max-total-corpus-chunks: 40000
      cache-max-users: 20

# ── 生产安全基线 ────────────────────────────────────────────────────────────
# 下面四项在 application.yml 里已经是安全默认值；这里显式写出来，是因为它们一旦被
# 改回开发值（旧配置文件、临时调试忘了改），患者数据就会进日志或接口文档页。
# StartupSafetyGuard 在 server/prod profile 下会逐项检查，任一项不满足即拒绝启动。
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
knife4j:
  enable: false

logging:
  level:
    # 模型 prompt 与消息体只在排查时临时开 debug，排查完改回来。
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: warn
    com.csust.eyediagnosis.service.impl.DocumentProcessingService: info

server:
  servlet:
    session:
      cookie:
        # 站点走 HTTPS 时必须为 true；由 StartupSafetyGuard 强制。
        secure: true

# ── gRPC 诊断通道 ───────────────────────────────────────────────────────────
# 影像字节与诊断结论都走这条链路。非回环地址上的明文连接既无加密也无对端校验，
# 因此跨主机部署必须二选一，否则 StartupSafetyGuard 在 server/prod 下拒绝启动：
#   1) 开 TLS（下面的 tls-enabled: true；内网私有 CA 用 tls-ca-cert-path，需双向认证再加客户端证书）；
#   2) 或确认这段链路已被网络隔离覆盖，显式承认 plaintext-allowed: true。
diagnosis:
  grpc:
    host: 127.0.0.1            # 算法服务地址；跨主机时改成内网地址
    port: 50051
    tls-enabled: false
    # tls-ca-cert-path: /etc/iris/certs/ca.pem
    # tls-client-cert-path: /etc/iris/certs/client.pem
    # tls-client-key-path: /etc/iris/certs/client-key.pem
    plaintext-allowed: false
