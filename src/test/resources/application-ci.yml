spring:
  # PostgreSQL 18 + pgvector。关系数据在 diagnosis schema，向量在 rag schema。
  # 一个数据库承载两种数据，逻辑隔离靠 schema + 角色权限，不靠实例。
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/iris_ci?currentSchema=diagnosis,rag,public&stringtype=unspecified}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:iris_app}
    password: ${SPRING_DATASOURCE_PASSWORD:ci-app-password}
  session:
    store-type: none
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  flyway:
    # PostgreSQL 线是独立历史（db/postgresql）；MySQL 线（db/migration）保留为历史记录。
    locations: classpath:db/postgresql
    schemas: diagnosis
    default-schema: diagnosis
    create-schemas: true
    validate-on-migrate: true
    # 迁移账号拥有 DDL；应用账号只有 DML（见 scripts/postgresql/bootstrap-roles.sql）。
    user: ${IRIS_FLYWAY_USER:iris_migrator}
    password: ${IRIS_FLYWAY_PASSWORD:ci-migrator-password}
  ai:
    openai:
      api-key: ci-placeholder-openai-api-key
    dashscope:
      api-key: ci-placeholder-dashscope-api-key

cos:
  client:
    host: https://example.invalid
    secretId: ci-placeholder-secret-id
    secretKey: ci-placeholder-secret-key
    region: ap-guangzhou
    bucket: ci-placeholder-bucket
spring.autoconfigure.exclude: com.alibaba.cloud.ai.agent.studio.SaaStudioWebModuleAutoConfiguration

# 基础层 application.yml 的视觉模型密钥改为 ${DASHSCOPE_API_KEY}（无默认值）以强制
# 启动期失败；CI 不需要真密钥，这里给占位符把它盖掉，避免 CI 依赖外部环境变量。
eye-diagnosis:
  vision-recognition:
    api-key: ci-placeholder-dashscope-api-key
  database:
    require-postgresql: true
    min-major-version: 18
  rag:
    vector-store:
      schema: rag
      table: iris_knowledge_vectors
      dimensions: 1024
